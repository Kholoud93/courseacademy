<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الشهادة — coursacademy</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/certificate-details.css">
</head>
<body class="layout-main" data-layout="main" data-page="certificate-details">
  <div id="site-header"></div>

  <main class="layout-main__content cert-detail">
    <div class="container cert-detail__container">
      <div class="cert-detail__preview">
        <img
          src="assets/images/certificate-template.png"
          alt="شهادة إتمام الدورة"
          class="cert-detail__image"
          width="1200"
          height="850"
        >
      </div>

      <div class="cert-detail__actions">
        <a href="assets/images/certificate-template.png" download="certificate.png" class="cert-detail__btn cert-detail__btn--primary">
          <i class="ri-download-2-line"></i>
          تحميل الشهادة PDF
        </a>
        <button type="button" class="cert-detail__btn cert-detail__btn--outline" data-cert-share>
          <i class="ri-share-forward-line"></i>
          مشاركة
        </button>
        <button type="button" class="cert-detail__btn cert-detail__btn--ghost" data-cert-print>
          <i class="ri-printer-line"></i>
          طباعة
        </button>
      </div>

      <div class="cert-detail__verify">
        <div class="cert-detail__verify-icon">
          <i class="ri-shield-check-line"></i>
        </div>
        <h2 class="cert-detail__verify-title">شهادة معتمدة وقابلة للتحقق</h2>
        <p class="cert-detail__verify-text">
          يمكن لأي جهة التحقق من صحة هذه الشهادة عبر مسح رمز QR أو زيارة صفحة التحقق على موقع كورساديمي.
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/certificate-details.js"></script>
</body>
</html>
