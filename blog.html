<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المدونة — coursacademy</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/blog.css">
</head>
<body data-layout="main" data-page="blog">

  <div id="site-header"></div>

  <main>
    <section class="blog-hero">
      <div class="container blog-hero__inner">
        <h1 class="blog-hero__title">المدونة الهندسية</h1>
        <div class="blog-hero__tagline">
          <span class="blog-hero__tagline-line" aria-hidden="true"></span>
          <span class="blog-hero__tagline-text">YOUR GATE TO SUCCESS</span>
          <span class="blog-hero__tagline-line" aria-hidden="true"></span>
        </div>
        <p class="blog-hero__desc">أحدث المقالات والنصائح في الهندسة المعمارية، BIM، التصميم الداخلي، وإدارة المشاريع</p>

        <form class="blog-hero__search" action="blog.html" method="get">
          <span class="blog-hero__search-icon" aria-hidden="true">
            <i class="ri-search-line"></i>
          </span>
          <input type="search" class="blog-hero__search-input" name="q" placeholder="ابحث عن مقال...">
        </form>
      </div>
    </section>

    <section class="blog-page">
      <div class="container blog-page__container">
        <div class="blog-featured-wrap">
          <h2 class="blog-section__title"><i class="ri-star-fill"></i> المقال المميز</h2>
          <div id="blog-featured"></div>
        </div>

        <div class="blog-filters" id="blog-filters" aria-label="تصفية المقالات"></div>

        <p id="blog-count" class="blog-page__count"></p>
        <div id="blog-grid" class="blog-page__grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/blog.js"></script>
</body>
</html>
