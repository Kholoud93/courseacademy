<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدورات — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-layout="main" data-page="courses">
  <div id="site-header"></div>

  <main class="layout-main__content">
    <section class="page-banner">
      <div class="container">
        <h1 class="page-banner__title">الدورات التدريبية</h1>
        <nav class="breadcrumb"><span class="breadcrumb__item"><a href="index.html">الرئيسية</a></span><span class="breadcrumb__item">الدورات</span></nav>
      </div>
    </section>

    <section class="section">
      <div class="container courses-layout">
        <aside class="filters">
          <div class="filters__group">
            <h3 class="filters__title">التصنيف</h3>
            <label class="filters__option"><input type="checkbox" class="checkbox"> برمجة</label>
            <label class="filters__option"><input type="checkbox" class="checkbox"> تصميم</label>
            <label class="filters__option"><input type="checkbox" class="checkbox"> تسويق</label>
          </div>
          <div class="filters__group">
            <h3 class="filters__title">السعر</h3>
            <label class="filters__option"><input type="checkbox" class="checkbox"> مجاني</label>
            <label class="filters__option"><input type="checkbox" class="checkbox"> مدفوع</label>
          </div>
        </aside>
        <div>
          <p id="course-count" class="courses-page__count"></p>
          <div id="course-grid" class="courses-list__grid"></div>
          <div id="pagination"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/courses.js"></script>
</body>
</html>
