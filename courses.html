<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدورات — coursacademy</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/courses.css">
</head>
<body data-layout="main" data-page="courses">

  <div id="site-header"></div>

  <main>
    <section class="courses-hero">
      <div class="container courses-hero__inner">
        <span class="courses-hero__badge"><i class="ri-book-open-line"></i> دليل الدورات التدريبية</span>
        <h1 class="courses-hero__title">اكتشف دوراتنا الهندسية</h1>
        <p class="courses-hero__desc">أكثر من 300 دورة احترافية في مختلف المجالات الهندسية</p>

        <form class="courses-hero__search" action="courses.html" method="get">
          <span class="courses-hero__search-icon" aria-hidden="true">
            <i class="ri-search-line ri-lg"></i>
          </span>
          <input type="search" class="courses-hero__search-input" name="q" placeholder="ابحث عن دورة تدريبية...">
        </form>

        <div class="courses-hero__stats">
          <div class="courses-hero__stat">
            <span class="courses-hero__stat-icon"><i class="ri-book-open-line"></i></span>
            <strong>+٣٠٠</strong>
            <span>دورة</span>
          </div>
          <div class="courses-hero__stat">
            <span class="courses-hero__stat-icon"><i class="ri-team-line"></i></span>
            <strong>+٥٠k</strong>
            <span>طالب</span>
          </div>
          <div class="courses-hero__stat">
            <span class="courses-hero__stat-icon"><i class="ri-award-line"></i></span>
            <strong>+٥k</strong>
            <span>شهادة</span>
          </div>
          <div class="courses-hero__stat">
            <span class="courses-hero__stat-icon"><i class="ri-star-line"></i></span>
            <strong>٤.٨</strong>
            <span>تقييم</span>
          </div>
        </div>
      </div>
    </section>

    <section class="courses-page">
      <div class="container courses-layout">
        <aside class="courses-sidebar" aria-label="تصفية الدورات">
          <div class="courses-filters-card">
            <h2 class="courses-filters-card__title"><i class="ri-book-open-line"></i> التصنيف</h2>
            <div class="courses-filters-card__list" id="category-filters"></div>
          </div>

          <div class="courses-filters-card">
            <h2 class="courses-filters-card__title"><i class="ri-bar-chart-grouped-line"></i> المستوى</h2>
            <div class="courses-filters-card__list" id="level-filters"></div>
          </div>

          <div class="courses-filters-promo">
            <span class="courses-filters-promo__icon"><i class="ri-award-line"></i></span>
            <strong>خصم خاص!</strong>
            <p>احصل على خصم 40% على جميع المسارات التعليمية</p>
            <a href="paths.html" class="btn btn--white btn--sm">استكشف المسارات</a>
          </div>
        </aside>

        <div class="courses-page__main">
          <div class="courses-page__toolbar">
            <p id="course-count" class="courses-page__count"></p>
            <label class="courses-page__sort">
              <span class="courses-page__sort-label">ترتيب الدورات</span>
              <select id="course-sort" class="courses-page__sort-select">
                <option value="newest">الأحدث</option>
                <option value="popular">الأكثر شعبية</option>
                <option value="rating">الأعلى تقييماً</option>
                <option value="price-asc">السعر: من الأقل</option>
                <option value="price-desc">السعر: من الأعلى</option>
              </select>
            </label>
          </div>

          <div id="course-grid" class="home-featured__grid courses-page__grid"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/courses.js"></script>
</body>
</html>
