<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المقال — coursacademy</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/blog.css">
</head>
<body data-layout="main" data-page="blog-details">

  <div id="site-header"></div>

  <main>
    <section class="blog-detail-hero">
      <div class="container blog-detail-hero__inner">
        <nav class="blog-detail-hero__breadcrumb" aria-label="مسار التنقل">
          <a href="index.html">الرئيسية</a>
          <span aria-hidden="true">&gt;</span>
          <a href="blog.html">المدونة</a>
          <span aria-hidden="true">&gt;</span>
          <span id="bd-breadcrumb-title">المقال</span>
        </nav>
      </div>
    </section>

    <article class="blog-article">
      <div class="container blog-article__container">
        <span class="blog-article__category" id="bd-category"></span>
        <h1 class="blog-article__title" id="article-title"></h1>

        <div class="blog-article__head">
          <div class="blog-article__author">
            <img id="bd-author-avatar" src="" alt="" class="blog-article__avatar">
            <div>
              <strong id="bd-author-name"></strong>
              <time id="bd-published-at"></time>
            </div>
          </div>
          <div class="blog-article__stats">
            <span><i class="ri-time-line"></i> <span id="bd-read-time"></span></span>
            <span><i class="ri-eye-line"></i> <span id="bd-views"></span></span>
          </div>
        </div>

        <img id="article-image" class="blog-article__image" alt="">
        <div class="blog-article__tags" id="bd-tags"></div>
        <div id="article-content" class="blog-article__content"></div>
      </div>
    </article>

    <section class="blog-related">
      <div class="container blog-related__container">
        <h2 class="blog-section__title">مقالات ذات صلة</h2>
        <div id="related-posts" class="blog-page__grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/blog.js"></script>
</body>
</html>
