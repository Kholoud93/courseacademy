<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الدورة — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-layout="main" data-page="courses">
  <div id="site-header"></div>

  <main class="layout-main__content">
    <section class="page-banner">
      <div class="container">
        <h1 class="page-banner__title">تفاصيل الدورة</h1>
        <nav class="breadcrumb">
          <span class="breadcrumb__item"><a href="index.html">الرئيسية</a></span>
          <span class="breadcrumb__item"><a href="courses.html">الدورات</a></span>
          <span class="breadcrumb__item">التفاصيل</span>
        </nav>
      </div>
    </section>

    <section class="section">
      <div class="container course-details__layout">
        <div>
          <h2 id="course-title" class="course-details__title"></h2>
          <p id="course-desc" class="course-details__desc"></p>

          <div data-tabs="course-detail">
            <div class="tabs">
              <div class="tabs__list">
                <button type="button" class="tabs__btn is-active" data-tabs="course-detail" data-tab="overview">نظرة عامة</button>
                <button type="button" class="tabs__btn" data-tabs="course-detail" data-tab="curriculum">المنهج</button>
                <button type="button" class="tabs__btn" data-tabs="course-detail" data-tab="reviews">التقييمات</button>
              </div>
            </div>
            <div id="tab-panel"><p>جاري التحميل...</p></div>
            <div id="curriculum-accordion" class="accordion" hidden></div>
          </div>
        </div>

        <aside class="card card--buy">
          <div id="course-price" class="card__price"></div>
          <a href="login.html" class="btn btn--primary btn--full">اشترك الآن</a>
          <ul id="course-features" class="card__features"></ul>
        </aside>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/course-details.js"></script>
</body>
</html>
