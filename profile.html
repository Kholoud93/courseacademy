<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="layout-dashboard" data-layout="dashboard" data-page="profile">
  <div id="dashboard-shell"></div>
  <div class="layout-dashboard__body">
    <header class="dashboard-header layout-dashboard__header"><button type="button" class="btn btn--icon" data-drawer-open="sidebar">☰</button></header>
    <main class="layout-dashboard__content">
      <div class="container container--narrow">
        <h1 class="dashboard-page__title">الملف الشخصي</h1>
        <img src="https://picsum.photos/seed/user1/128/128" class="profile-page__avatar" alt="">
        <form data-prevent>
          <div class="form-group"><label class="form-label">الاسم</label><input type="text" class="input input--bordered" value="محمد العتيبي"></div>
          <div class="form-group"><label class="form-label">البريد</label><input type="email" class="input input--bordered" value="mohammed@example.com"></div>
          <div class="form-group"><label class="form-label">الهاتف</label><input type="tel" class="input input--bordered" value="0501234567"></div>
          <button type="submit" class="btn btn--primary">حفظ التغييرات</button>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
