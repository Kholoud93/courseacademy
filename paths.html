<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المسارات — coursacademy</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/paths.css">
</head>
<body data-layout="main" data-page="paths">

  <div id="site-header"></div>

  <main>
    <section class="paths-hero">
      <div class="container paths-hero__inner">
        <span class="paths-hero__badge"><i class="ri-book-open-line"></i> المسارات التعليمية</span>
        <div class="paths-hero__tagline">
          <span class="paths-hero__tagline-line" aria-hidden="true"></span>
          <span class="paths-hero__tagline-text">YOUR GATE TO SUCCESS</span>
          <span class="paths-hero__tagline-line" aria-hidden="true"></span>
        </div>
        <h1 class="paths-hero__title">مسارات هندسية متكاملة</h1>
        <p class="paths-hero__desc">مسارات تعليمية متخصصة تأخذك من الصفر إلى الاحتراف مع شهادات معتمدة</p>
      </div>
    </section>

    <section class="paths-page">
      <div class="container paths-page__container">
        <div class="paths-page__head">
          <h2 class="paths-page__title">المسارات التعليمية</h2>
        </div>
        <div id="paths-grid" class="paths-page__grid"></div>
      </div>

    <section class="paths-why">

        <div class="paths-why__card">
          <div class="paths-why__head">

          </div>
          <div id="paths-why-grid" class="paths-why__grid"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/paths.js"></script>
</body>
</html>
