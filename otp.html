<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رمز التحقق — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-layout="auth" data-page="otp">
  <div class="layout-auth">
    <aside class="auth-sidebar layout-auth__sidebar"><h2 class="auth-sidebar__title">تحقق من هويتك</h2></aside>
    <div class="layout-auth__form">
      <div class="auth-form">
        <h1 class="auth-form__title">رمز التحقق</h1>
        <form data-auth-form>
          <div class="otp-group">
            <input class="input input--otp" type="text" maxlength="1" data-otp-index="0">
            <input class="input input--otp" type="text" maxlength="1" data-otp-index="1">
            <input class="input input--otp" type="text" maxlength="1" data-otp-index="2">
            <input class="input input--otp" type="text" maxlength="1" data-otp-index="3">
          </div>
          <button type="submit" class="btn btn--primary btn--full auth-form__submit">تحقق</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
