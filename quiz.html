<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبار — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="layout-dashboard" data-layout="dashboard" data-page="quiz">
  <div id="dashboard-shell"></div>
  <div class="layout-dashboard__body">
    <header class="dashboard-header layout-dashboard__header"><button type="button" class="btn btn--icon" data-drawer-open="sidebar">☰</button></header>
    <main class="layout-dashboard__content">
      <div class="quiz">
        <div class="quiz__header"><span>السؤال 1 من 1</span><span class="quiz__timer">⏱ 10:00</span></div>
        <h2 id="quiz-question" class="quiz__question"></h2>
        <div id="quiz-options" class="quiz__options"></div>
        <div class="quiz__nav">
          <button type="button" class="btn btn--outline">السابق</button>
          <button type="button" class="btn btn--primary">التالي</button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/learning.js"></script>
</body>
</html>
