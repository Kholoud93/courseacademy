<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-layout="auth" data-page="forgot-password">
  <div class="layout-auth">
    <aside class="auth-sidebar layout-auth__sidebar"><h2 class="auth-sidebar__title">استعادة الحساب</h2></aside>
    <div class="layout-auth__form">
      <div class="auth-form">
        <h1 class="auth-form__title">نسيت كلمة المرور؟</h1>
        <form data-auth-form>
          <div class="form-group"><label class="form-label">البريد الإلكتروني</label><input type="email" class="input input--bordered" required></div>
          <button type="submit" class="btn btn--primary btn--full">إرسال رمز التحقق</button>
        </form>
        <p class="auth-form__footer"><a href="login.html" class="auth-form__footer-link">العودة لتسجيل الدخول</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
