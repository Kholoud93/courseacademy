<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإشعارات — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="layout-dashboard" data-layout="dashboard" data-page="notifications">
  <div id="dashboard-shell"></div>
  <div class="layout-dashboard__body">
    <header class="dashboard-header layout-dashboard__header"><button type="button" class="btn btn--icon" data-drawer-open="sidebar">☰</button></header>
    <main class="layout-dashboard__content">
      <h1 class="dashboard-page__title">الإشعارات</h1>
      <div id="notification-list" class="card">
<article class="card card--list-item is-unread">
      
      <div>
        <h4 class="card__title">دورة جديدة</h4>
        <p class="card__meta">تم إضافة دورة React المتقدم</p>
        <time class="card__time">منذ 5 دقائق</time>
      </div>
    </article>
    <article class="card card--list-item is-unread">
      
      <div>
        <h4 class="card__title">شهادة جاهزة</h4>
        <p class="card__meta">شهادتك جاهزة للتحميل</p>
        <time class="card__time">منذ ساعة</time>
      </div>
    </article>
    <article class="card card--list-item">
      
      <div>
        <h4 class="card__title">تذكير</h4>
        <p class="card__meta">لديك درس غير مكتمل</p>
        <time class="card__time">أمس</time>
      </div>
    </article>
</div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
