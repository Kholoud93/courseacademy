<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرسائل — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="layout-dashboard" data-layout="dashboard" data-page="messages">
  <div id="dashboard-shell"></div>
  <div class="layout-dashboard__body">
    <header class="dashboard-header layout-dashboard__header"><button type="button" class="btn btn--icon" data-drawer-open="sidebar">☰</button></header>
    <main class="layout-dashboard__content">
      <h1 class="dashboard-page__title">الرسائل</h1>
      <div class="messages-layout">
        <div id="message-list" class="messages-layout__list">
<article class="card card--list-item is-unread">
      <img class="card__avatar" src="https://picsum.photos/seed/inst1/64/64" alt="">
      <div>
        <h4 class="card__title">أحمد محمد</h4>
        <p class="card__meta">مرحباً، هل لديك سؤال؟</p>
        <time class="card__time">10:30</time>
      </div>
    </article>
    <article class="card card--list-item">
      <img class="card__avatar" src="https://picsum.photos/seed/inst2/64/64" alt="">
      <div>
        <h4 class="card__title">سارة علي</h4>
        <p class="card__meta">تم مراجعة مشروعك</p>
        <time class="card__time">أمس</time>
      </div>
    </article>
</div>
        <div class="messages-layout__thread messages-layout__thread--empty"><p>اختر محادثة لعرض الرسائل</p></div>
      </div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
