<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="layout-dashboard" data-layout="dashboard" data-page="dashboard">
  <div id="dashboard-shell"></div>

  <div class="layout-dashboard__body">
    <header class="dashboard-header layout-dashboard__header">
      <button type="button" class="btn btn--icon dashboard-header__menu-toggle" data-drawer-open="sidebar" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="dashboard-header__search">
        <input type="search" class="input input--search" placeholder="ابحث...">
      </div>
      <div class="dashboard-header__actions">
        <a href="notifications.html" class="btn btn--icon" aria-label="الإشعارات">🔔</a>
        <a href="profile.html"><img src="https://picsum.photos/seed/user1/64/64" class="dashboard-header__avatar" alt=""></a>
      </div>
    </header>

    <main class="layout-dashboard__content">
      <section class="welcome-banner">
        <h2 class="welcome-banner__title">مرحباً، <span id="welcome-name">محمد العتيبي</span>! 👋</h2>
        <p>استمر في رحلة التعلم وحقق أهدافك.</p>
      </section>

      <div id="stat-cards" class="dashboard__stats-grid">
<article class="card card--stat">
      <div class="card__icon-box" style="--stat-color: #0056D2">📚</div>
      <div>
        <div class="card__value">2</div>
        <div class="card__label">دورات جارية</div>
      </div>
    </article>
    <article class="card card--stat">
      <div class="card__icon-box" style="--stat-color: #22C55E">✅</div>
      <div>
        <div class="card__value">1</div>
        <div class="card__label">دورات مكتملة</div>
      </div>
    </article>
    <article class="card card--stat">
      <div class="card__icon-box" style="--stat-color: #FFB800">🏆</div>
      <div>
        <div class="card__value">1</div>
        <div class="card__label">شهادات</div>
      </div>
    </article>
    <article class="card card--stat">
      <div class="card__icon-box" style="--stat-color: #8B5CF6">⭐</div>
      <div>
        <div class="card__value">450</div>
        <div class="card__label">نقاط</div>
      </div>
    </article>
</div>

      <h2 class="dashboard-page__section-title">تابع التعلم</h2>
      <div id="continue-learning" class="dashboard__learning-grid"></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
