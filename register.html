<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب — أكاديمية الدورات</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-layout="auth" data-page="register">
  <div class="layout-auth">
    <aside class="auth-sidebar layout-auth__sidebar">
      <h2 class="auth-sidebar__title">ابدأ رحلتك التعليمية</h2>
      <p class="auth-sidebar__desc">انضم إلى آلاف الطلاب اليوم.</p>
    </aside>
    <div class="layout-auth__form">
      <div class="auth-form">
        <div class="auth-form__logo">أكاديمية الدورات</div>
        <h1 class="auth-form__title">إنشاء حساب جديد</h1>
        <form data-auth-form>
          <div class="form-group"><label class="form-label">الاسم الكامل</label><input type="text" class="input input--bordered" required></div>
          <div class="form-group"><label class="form-label">البريد الإلكتروني</label><input type="email" class="input input--bordered" required></div>
          <div class="form-group"><label class="form-label">كلمة المرور</label><input type="password" class="input input--bordered" required></div>
          <button type="submit" class="btn btn--primary btn--full">إنشاء حساب</button>
        </form>
        <p class="auth-form__footer">لديك حساب؟ <a href="login.html" class="auth-form__footer-link">تسجيل الدخول</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
